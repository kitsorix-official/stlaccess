name: indexnow

on:
  push:
    branches: [main]
  schedule:
    # Re-submit the full sitemap every 3 days at 06:00 UTC to help IndexNow
    # pick up URLs it may have missed on the initial push-triggered run.
    - cron: "0 6 */3 * *"

concurrency:
  group: indexnow
  cancel-in-progress: true

permissions:
  contents: write
  checks: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Wait for Cloudflare Pages deployment
        # Only wait for a fresh deploy on push builds. On scheduled cron runs
        # there is no new deployment, so skip straight to submitting.
        if: github.event_name == 'push'
        run: node .github/scripts/wait-for-deploy.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Submit URLs to IndexNow
        run: npm run indexnow

      # The submitted-URLs manifest (.indexnow/last-submitted.json) is a local
      # build/runtime record and is gitignored. We deliberately do NOT commit it
      # back to the repo — committing it each run caused divergent history and
      # noisy "indexnow: record submitted URLs" commits that fought with local
      # pushes. The manifest still persists across the site's own deploy hook
      # runs; see the IndexNow deploy script.
