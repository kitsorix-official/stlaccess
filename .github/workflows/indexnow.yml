name: indexnow

on:
  push:
    branches: [main]

concurrency:
  group: indexnow
  cancel-in-progress: true

permissions:
  contents: write
  checks: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Cloudflare Pages deployment
        run: node .github/scripts/wait-for-deploy.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Submit URLs to IndexNow
        run: npm run indexnow

      - name: Commit updated manifest
        run: |
          git config user.name "indexnow[bot]"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet .indexnow/last-submitted.json; then
            echo "No manifest changes; nothing to commit."
            exit 0
          fi
          git add .indexnow/last-submitted.json
          git commit -m "indexnow: record submitted URLs"
          git push
