<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | STLACCESS</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="page-header">
    <div class="container">
      <h1>Page Not Found</h1>
      <p class="subtitle">The page you're looking for doesn't exist. Redirecting to the homepage in <span id="countdown">10</span> seconds.</p>
    </div>
  </header>
  <main>
    <section class="container text-center mt-2">
      <a href="/" class="btn-primary">Go to Homepage Now</a>
    </section>
  </main>
  <script>
    let s = 10;
    const el = document.getElementById('countdown');
    const t = setInterval(() => {
      s--;
      if (el) el.textContent = s;
      if (s <= 0) { clearInterval(t); window.location.href = '/'; }
    }, 1000);
  </script>
</body>
</html>
